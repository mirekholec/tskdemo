    <section class="hero" id="uvod">
      <img class="hero__image" src="/assets/images/hero.jpg" alt="Prosluněný interiér kavárny s dřevěnými stoly, rostlinami a velkými okny do ulice" width="1536" height="1024" fetchpriority="high">
      <div class="container hero__content">
        <p class="eyebrow eyebrow--light">Praha 2 – Vinohrady · <span class="nowrap">denně {{ openingHours.open }}:00–{{ openingHours.close }}:00</span></p>

        <p class="hero__tagline">{{ cafe.tagline }}. Místo, kde se nikam nespěchá.</p>
        <div class="hero__actions">
          <a class="button button--primary button--large" href="/rezervace">Rezervovat stůl</a>
          <a class="button button--ghost button--large" href="/#nabidka">Prohlédnout nabídku</a>
        </div>
      </div>
    </section>
